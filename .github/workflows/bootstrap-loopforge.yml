name: Bootstrap LoopForge source

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/READY"
      - ".github/workflows/bootstrap-loopforge.yml"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble verified source archive
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/loopforge-source.b64
          for i in $(seq -w 0 16); do
            cat ".bootstrap/source.part-${i}" >> /tmp/loopforge-source.b64
          done
          base64 --decode /tmp/loopforge-source.b64 > /tmp/loopforge-source.tar.gz
          echo "62844befef6ff2ca03185ffce992a0e9b177cdd2d05500c90dab139c41c6f8e4  /tmp/loopforge-source.tar.gz" | sha256sum --check
          mkdir -p /tmp/loopforge-source
          tar -xzf /tmp/loopforge-source.tar.gz -C /tmp/loopforge-source

      - name: Replace bootstrap tree with production source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/***' \
            /tmp/loopforge-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import LoopForge Pro v2 production repository" || exit 0
          git push origin HEAD:main
