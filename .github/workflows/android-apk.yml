name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "package.json"
      - "app.config.ts"
      - "app/**"
      - "components/**"
      - "lib/**"
      - "assets/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate deterministic assets
        run: node scripts/generate-assets.mjs

      - name: Preflight
        run: pnpm preflight

      - name: Source integrity
        run: pnpm integrity

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LoopForge-Pro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoopForge-Pro-Android-APK
          path: LoopForge-Pro-debug.apk
          if-no-files-found: error
          retention-days: 14
