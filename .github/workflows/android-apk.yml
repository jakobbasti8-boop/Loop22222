name: LoopForge Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "package.json"
      - "app.config.ts"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "constants/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: loopforge-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate deterministic assets
        run: pnpm assets

      - name: Preflight
        run: pnpm preflight

      - name: Source integrity
        run: pnpm integrity

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean --non-interactive

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LoopForge-Pro-v2-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LoopForge-Pro-v2-Android-APK
          path: LoopForge-Pro-v2-debug.apk
          if-no-files-found: error
          retention-days: 14
