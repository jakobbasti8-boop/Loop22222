name: LoopForge Standalone Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/android-apk.yml"
      - "package.json"
      - "app.config.ts"
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "constants/**"
      - "scripts/**"

permissions:
  contents: read

concurrency:
  group: loopforge-standalone-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate deterministic assets
        run: pnpm assets

      - name: Preflight
        run: pnpm preflight

      - name: Source integrity
        run: pnpm integrity

      - name: Generate native Android project
        run: pnpm exec expo prebuild --platform android --clean --non-interactive

      # IMPORTANT: Debug variants normally expect Metro. For an APK that can be
      # installed and launched standalone, build the release variant so the JS
      # bundle and assets are embedded in the APK. x86_64 is included only so
      # the exact same APK can also be boot-tested in the CI Android emulator.
      - name: Build standalone release-test APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Prepare APK and runtime diagnostics
        run: |
          mkdir -p runtime-smoke
          cp android/app/build/outputs/apk/release/app-release.apk LoopForge-Pro-v2-standalone-test.apk
          sha256sum LoopForge-Pro-v2-standalone-test.apk | tee runtime-smoke/apk-sha256.txt

      - name: Boot APK in Android emulator and verify Studio UI
        id: smoke
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            APK="$GITHUB_WORKSPACE/LoopForge-Pro-v2-standalone-test.apk"
            OUT="$GITHUB_WORKSPACE/runtime-smoke"
            PACKAGE="com.loopforge.mobile"

            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PACKAGE" || true
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 15

            adb exec-out screencap -p > "$OUT/launch.png" || true
            adb shell uiautomator dump /sdcard/loopforge-window.xml || true
            adb pull /sdcard/loopforge-window.xml "$OUT/window.xml" || true
            adb shell dumpsys activity activities > "$OUT/activity.txt" || true
            adb logcat -d -v threadtime > "$OUT/logcat.txt" || true

            PID="$(adb shell pidof "$PACKAGE" | tr -d '\r' || true)"
            printf '%s\n' "$PID" > "$OUT/pid.txt"
            if [ -z "$PID" ]; then
              echo "LoopForge process is not alive after launch." >&2
              exit 20
            fi

            if grep -Eqi 'FATAL EXCEPTION|Unable to load script|ReactNativeJS.*(TypeError|ReferenceError|Invariant Violation|Error:)' "$OUT/logcat.txt"; then
              echo "Fatal Android/React Native startup error detected." >&2
              grep -Ei 'FATAL EXCEPTION|Unable to load script|ReactNativeJS.*(TypeError|ReferenceError|Invariant Violation|Error:)' "$OUT/logcat.txt" | tail -n 80 >&2 || true
              exit 21
            fi

            if [ ! -s "$OUT/window.xml" ] || ! grep -q 'LoopForge Pro Studio' "$OUT/window.xml"; then
              echo "App launched, but the Studio UI was not visible after 15 seconds." >&2
              tail -n 160 "$OUT/logcat.txt" >&2 || true
              exit 22
            fi

            echo "RUNTIME_SMOKE_OK: LoopForge Pro Studio rendered in Android emulator."

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LoopForge-runtime-smoke-diagnostics
          path: runtime-smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce runtime smoke test
        if: steps.smoke.outcome != 'success'
        run: |
          echo "Android runtime smoke test failed. APK will NOT be published."
          exit 1

      # The installable artifact exists only after the APK has actually booted
      # and the Studio UI was detected in a real Android emulator.
      - name: Upload verified standalone APK
        uses: actions/upload-artifact@v7
        with:
          name: LoopForge-Pro-v2-VERIFIED-Android-APK
          path: LoopForge-Pro-v2-standalone-test.apk
          if-no-files-found: error
          retention-days: 14
